function nav(){
  $('#tabs').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${v}</button>`).join('');
  $('#chips').innerHTML=['All',...T.map((_,i)=>'L'+(i+1))].map((v,i)=>`<button class="${i===L?'on':''}" title="${i?T[i-1]:'All lectures'}" onclick="lec(${i})">${v}</button>`).join('');
}
function go(t){tab=t;init()}
function lec(i){L=i;init()}
function init(){
  if(tab==='cards'){deck=sh(F(C));di=0;flip=false}
  if(tab==='quiz'){newTest()}
  if(tab==='code'){kd=F(K)}
  nav();draw();
}
function draw(){
  const m=$('#m');
  if(tab==='notes'){
    const n=F(N);let last=0,h='';
    n.forEach(([l,t,b])=>{h+=`<div class="card"><h2><span>Lecture ${l} · ${T[l-1]}</span>${t}</h2><ul>${b.map(x=>`<li>${x}</li>`).join('')}</ul></div>`});
    m.innerHTML=h;
  }else if(tab==='cards'){
    if(!deck.length){m.innerHTML='<p>No cards.</p>';return}
    const c=deck[di];
    m.innerHTML=`<p class="mut" style="text-align:center">Card ${di+1} of ${deck.length} · Lecture ${c[0]} · tap card to flip</p>
    <div class="card fc ${flip?'back':''}" onclick="flip=!flip;draw()">${flip?c[2]:c[1]}</div>
    <div class="row"><button onclick="step(-1)">← Prev</button><button onclick="step(1)">Next →</button><button onclick="init()">Shuffle</button></div>`;
  }else if(tab==='quiz'){
    if(!qs.length){m.innerHTML='<p>No questions.</p>';return}
    if(done){m.innerHTML=`<div class="card"><div class="big">${score} / ${qs.length}</div><p style="text-align:center">${score===qs.length?'Perfect!':score>=qs.length*.7?'Good work – review the misses.':'Keep practising – try the notes and flashcards.'}</p><div class="row"><button class="on" onclick="init()">New random test</button></div></div>`;return}
    const q=qs[qi];
    m.innerHTML=`<p class="mut">Question ${qi+1} of ${qs.length} · Lecture ${q.l} · Score ${score}</p><div class="card"><h2>${esc(q.q)}</h2>${q.o.map((o,i)=>`<button class="opt ${q.a!=null?(i===q.c?'ok':i===q.a?'no':''):''}" ${q.a!=null?'disabled':''} onclick="pick(${i})">${esc(o)}</button>`).join('')}</div>${q.a!=null?`<div class="row"><button class="on" onclick="nextQ()">${qi+1<qs.length?'Next':'See score'}</button></div>`:''}`;
  }else{
    m.innerHTML=`<div class="row"><button onclick="kd=sh(F(K));draw()">Shuffle order</button><span class="mut">Predict the output, then reveal the step-by-step trace.</span></div>`+kd.map(k=>`<div class="card"><span class="mut">Lecture ${k[0]} · ${T[k[0]-1]}</span><h2>What will be the output?</h2><pre>${esc(k[1])}</pre><details><summary>Reveal answer</summary><div class="ans"><b>Output:</b><pre>${esc(k[2])}</pre><b>How it works:</b><ol>${k[3].map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div></details></div>`).join('');
  }
}
function step(d){di=(di+d+deck.length)%deck.length;flip=false;draw()}
function newTest(){
  qs=sh(F(Q)).slice(0,10).map(r=>{const o=sh(r.slice(2).map((t,i)=>[t,i===0]));return{l:r[0],q:r[1],o:o.map(x=>x[0]),c:o.findIndex(x=>x[1]),a:null}});
  qi=0;score=0;done=false;
}
function pick(i){const q=qs[qi];if(q.a!=null)return;q.a=i;if(i===q.c)score++;draw()}
function nextQ(){if(qi+1<qs.length)qi++;else done=true;draw()}
init();
</script></body></html>
